name: fusebox_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1        # ← ДОБАВЛЕНО

# ↓ ДОБАВЛЕНО: конфиг генерации иконок
flutter_icons:
  image_path: assets/app_icon.png         # PNG 1024×1024 без скруглений
  adaptive_icon_foreground: assets/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  fonts:
    - family: GOST
      fonts:
        - asset: assets/fonts/GOST.ttf
          weight: 400